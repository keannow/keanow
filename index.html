<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEANN MARKET</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a0a0a;
  color:white;
  scroll-behavior:smooth;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:18px 25px;
  background:#111;
  border-bottom:1px solid #222;
}

.logo{
  color:#00e676;
  font-weight:bold;
  text-shadow:0 0 10px #00e676;
}

nav a{
  color:#aaa;
  margin-left:15px;
  text-decoration:none;
}

nav a:hover{
  color:white;
}

/* HERO */
.hero{
  height:90vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(to bottom, #0a0a0a, #050505);
}

.hero h1{
  font-size:48px;
  margin:0;
}

.hero p{
  color:#aaa;
  margin-top:10px;
}

.btn-main{
  margin-top:25px;
  padding:14px 28px;
  background:#00c853;
  border:none;
  color:white;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 0 15px #00c853;
}

.btn-main:hover{
  background:#00e676;
}

/* SECTION */
.section{
  padding:40px 20px;
}

.title{
  text-align:center;
  margin-bottom:20px;
  color:#ccc;
}

/* FORM */
.form-global{
  text-align:center;
  margin-bottom:20px;
}

.form-global input{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
  background:#111;
  color:white;
}

/* PRODUCT */
.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}

.card{
  width:240px;
  background:#161616;
  padding:20px;
  border-radius:14px;
  transition:0.3s;
  position:relative;
  border:1px solid #222;
}

.card:hover{
  transform:translateY(-6px) scale(1.03);
  background:#1f1f1f;
}

/* BADGE */
.badge{
  position:absolute;
  top:10px;
  right:10px;
  background:#ff3d00;
  padding:4px 8px;
  font-size:10px;
  border-radius:6px;
}

/* PRICE */
.price{
  margin-top:8px;
  color:#00e676;
  font-weight:bold;
}

/* BUTTON */
.btn{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#00c853;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.btn:hover{
  background:#00e676;
}

select{
  width:100%;
  padding:8px;
  margin-top:10px;
  border-radius:8px;
  background:#111;
  color:white;
  border:1px solid #333;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  color:#666;
  border-top:1px solid #222;
}
</style>
</head>

<body>

<nav>
  <div class="logo">KEANN MARKET</div>
  <div>
    <a href="#">Home</a>
    <a href="#produk">Produk</a>
  </div>
</nav>

<!-- HOME -->
<div class="hero">
  <h1>KEANN MARKET</h1>
  <p>Digital Store • Bot • Nokos • Tools Premium</p>

  <button class="btn-main" onclick="scrollToProduk()">
    🚀 Lihat Produk
  </button>
</div>

<!-- PRODUK -->
<div class="section" id="produk">

  <h2 class="title">Produk Terlaris</h2>

  <div class="form-global">
    <input type="text" id="nama" placeholder="Nama kamu">
    <input type="text" id="catatan" placeholder="Catatan (opsional)">
  </div>

  <div class="container">

    <div class="card">
      <div class="badge">BEST</div>
      <h3>🤖 Bot WhatsApp</h3>
      <div class="price">Mulai 2K</div>

      <select id="botSelect">
        <option value="Bot 1 Hari - 2K">1 Hari - 2K</option>
        <option value="Bot 7 Hari - 5K">7 Hari - 5K</option>
        <option value="Bot 30 Hari - 8K">30 Hari - 8K</option>
        <option value="Bot Permanen - 15K">Permanen - 15K</option>
      </select>

      <button class="btn" onclick="orderBot()">ORDER</button>
    </div>

    <div class="card">
      <h3>🔑 DRIP KEY</h3>
      <div class="price">Mulai 25K</div>

      <select id="dripSelect">
        <option value="DRIP 1 Hari - 25K">1 Hari - 25K</option>
        <option value="DRIP 7 Hari - 65K">7 Hari - 65K</option>
        <option value="DRIP 30 Hari - 140K">30 Hari - 140K</option>
      </select>

      <button class="btn" onclick="orderDrip()">ORDER</button>
    </div>

    <div class="card">
      <h3>📱 Nokos WhatsApp</h3>
      <div class="price">Ready</div>
      <button class="btn" onclick="order('Nokos WhatsApp')">ORDER</button>
    </div>

  </div>
</div>

<footer>
  © KEANN MARKET — Digital Store
</footer>

<script>
let nomor = "628125895306";

function scrollToProduk(){
  document.getElementById("produk").scrollIntoView();
}

function order(product){
  let nama = document.getElementById("nama").value;
  let catatan = document.getElementById("catatan").value;

  if(nama === ""){
    alert("Isi nama dulu!");
    return;
  }

  let pesan =
`Halo Admin KEANN MARKET

Nama: ${nama}
Order: ${product}
Catatan: ${catatan}`;

  alert("Menghubungkan ke WhatsApp...");

  let url = "https://wa.me/" + nomor + "?text=" + encodeURIComponent(pesan);
  window.open(url, "_blank");
}
function orderBot(){
  order(document.getElementById("botSelect").value);
}
function orderDrip(){
  order(document.getElementById("dripSelect").value);
}
</script>

</body>
</html>
