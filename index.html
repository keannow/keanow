<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KEANN MARKET</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#0a0a0a;
  color:white;
  overflow:hidden;
}

/* BACKGROUND GLOW */
.glow{
  position:absolute;
  width:400px;
  height:400px;
  background:#00e67620;
  border-radius:50%;
  filter:blur(120px);
  top:-100px;
  left:-100px;
}

.glow2{
  position:absolute;
  width:300px;
  height:300px;
  background:#00c85315;
  border-radius:50%;
  filter:blur(120px);
  bottom:-100px;
  right:-100px;
}

/* MAIN */
.main{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  z-index:2;
  padding:20px;
}

.content{
  max-width:600px;
}

/* TITLE */
.content h1{
  font-size:60px;
  letter-spacing:3px;
  color:#00e676;
  margin-bottom:15px;
}

/* TEXT */
.content p{
  color:#aaa;
  font-size:17px;
  line-height:1.7;
  margin-bottom:35px;
}

/* BUTTON */
.btn{
  display:inline-block;
  padding:14px 30px;
  border-radius:14px;
  text-decoration:none;
  font-weight:bold;
  color:white;
  background:linear-gradient(135deg,#00c853,#00e676);
  transition:0.25s;
}

.btn:hover{
  transform:scale(1.05);
}

/* MOBILE */
@media(max-width:700px){

.content h1{
  font-size:38px;
}

.content p{
  font-size:14px;
}

.btn{
  padding:12px 24px;
  font-size:14px;
}

}
</style>
</head>

<body>

<div class="glow"></div>
<div class="glow2"></div>

<section class="main">

  <div class="content">

    <h1>KEANN MARKET</h1>

    <p>
      Menyediakan berbagai kebutuhan digital
      dengan proses cepat, harga terjangkau,
      dan pelayanan terbaik.
    </p>

    <a href="produk.html" class="btn">
      MASUK KE PRODUK
    </a>

  </div>

</section>

</body>
</html>
