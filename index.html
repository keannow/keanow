<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KEANN MARKET</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#0a0a0a;
  color:white;
  overflow:hidden;
}

/* LOADING SCREEN */
#loader{
  position:fixed;
  width:100%;
  height:100vh;
  background:#0a0a0a;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  transition:1s;
}

.loader-text{
  color:#00e676;
  font-size:28px;
  font-weight:bold;
  letter-spacing:3px;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{opacity:0.4;}
  50%{opacity:1;}
  100%{opacity:0.4;}
}

/* PARTICLES */
.particles{
  position:absolute;
  width:100%;
  height:100vh;
  overflow:hidden;
  z-index:1;
}

.particles span{
  position:absolute;
  display:block;
  width:4px;
  height:4px;
  background:#00e676;
  border-radius:50%;
  animation:animate 15s linear infinite;
  opacity:0.5;
}

@keyframes animate{
  0%{
    transform:translateY(100vh) scale(0);
  }
  100%{
    transform:translateY(-10vh) scale(1);
  }
}

/* MAIN */
.main{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  z-index:2;
  padding:20px;
  animation:fade 1.5s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.content{
  max-width:600px;
}

/* TITLE */
.content h1{
  font-size:60px;
  letter-spacing:3px;
  color:#00e676;
  margin-bottom:15px;
}

/* TEXT */
.content p{
  color:#aaa;
  font-size:17px;
  line-height:1.7;
  margin-bottom:35px;
}

/* BUTTON */
.btn{
  display:inline-block;
  padding:14px 30px;
  border-radius:14px;
  text-decoration:none;
  font-weight:bold;
  color:white;
  background:linear-gradient(135deg,#00c853,#00e676);
  transition:0.25s;
  box-shadow:0 0 20px #00e67650;
}

.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 30px #00e67680;
}

/* MOBILE */
@media(max-width:700px){

.content h1{
  font-size:38px;
}

.content p{
  font-size:14px;
}

.btn{
  padding:12px 24px;
  font-size:14px;
}

}

</style>
</head>

<body>

<!-- LOADING -->
<div id="loader">
  <div class="loader-text">KEANN MARKET</div>
</div>

<!-- PARTICLES -->
<div class="particles">
  <span style="left:10%; animation-duration:12s;"></span>
  <span style="left:20%; animation-duration:18s;"></span>
  <span style="left:35%; animation-duration:10s;"></span>
  <span style="left:50%; animation-duration:15s;"></span>
  <span style="left:65%; animation-duration:20s;"></span>
  <span style="left:75%; animation-duration:13s;"></span>
  <span style="left:85%; animation-duration:17s;"></span>
  <span style="left:95%; animation-duration:11s;"></span>
</div>

<!-- MAIN -->
<section class="main">

  <div class="content">

    <h1>KEANN MARKET</h1>

    <p>
      Menyediakan berbagai kebutuhan digital
      dengan proses cepat, aman, dan harga terjangkau.
    </p>

    <a href="produk.html" class="btn">
      MASUK KE PRODUK
    </a>

  </div>

</section>

<script>

/* LOADING SCREEN */
window.addEventListener("load", () => {

  const loader = document.getElementById("loader");

  setTimeout(() => {
    loader.style.opacity = "0";
    loader.style.visibility = "hidden";
  }, 1200);

});

</script>

</body>
</html>
