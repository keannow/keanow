<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEANN MARKET</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(to bottom, #e3f2fd, #ffffff);
  color:#0d1b2a;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px;
}

.logo{
  font-weight:bold;
  color:#1565c0;
}

/* HERO */
.hero{
  height:90vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero h1{
  font-size:48px;
  margin:0;
}

.hero p{
  color:#555;
  margin-top:10px;
}

.btn{
  margin-top:25px;
  padding:14px 28px;
  background:#2196f3;
  border:none;
  color:white;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.btn:hover{
  background:#42a5f5;
  transform:scale(1.05);
}

/* BOX INFO */
.info{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:30px;
}

.box{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

footer{
  text-align:center;
  padding:20px;
  color:#666;
}
</style>
</head>

<body>

<nav>
  <div class="logo">KEANN MARKET</div>
</nav>

<div class="hero">
  <h1>KEANN MARKET</h1>
  <p>Digital Store • Simple • Fast • Trusted</p>

  <a href="produk.html">
    <button class="btn">Masuk ke Toko</button>
  </a>
</div>

<div class="info">
  <div class="box">⚡ Proses Cepat</div>
  <div class="box">🔒 Aman</div>
  <div class="box">💬 Support Admin</div>
</div>

<footer>
  © KEANN MARKET
</footer>

</body>
</html>
