<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEANN MARKET</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(180deg,#eaf4ff,#ffffff);
  color:#0d1b2a;
}

nav{
  display:flex;
  justify-content:space-between;
  padding:20px 30px;
}

.logo{
  font-weight:bold;
  color:#1565c0;
}

.hero{
  height:90vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero h1{
  font-size:52px;
  margin:0;
}

.hero p{
  color:#555;
  margin-top:10px;
}

.btn{
  margin-top:25px;
  padding:14px 30px;
  background:#2196f3;
  border:none;
  color:white;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  text-decoration:none;
  display:inline-block;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
  background:#42a5f5;
}

.info{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:30px;
  flex-wrap:wrap;
}

.box{
  background:white;
  padding:15px 20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<nav>
  <div class="logo">KEANN MARKET</div>
</nav>

<div class="hero">
  <h1>KEANN MARKET</h1>
  <p>Digital Store Premium</p>

  <a href="produk.html" class="btn">Masuk Toko</a>

  <div class="info">
    <div class="box">Fast Process</div>
    <div class="box">Secure</div>
    <div class="box">Support</div>
  </div>
</div>

<footer>
  KEANN MARKET
</footer>

</body>
</html>
