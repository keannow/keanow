<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk - KEANN MARKET</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a0a0a;
  color:white;
}

/* NAV */
nav{
  padding:18px 25px;
  background:#111;
  border-bottom:1px solid #222;
}

.logo{
  font-weight:bold;
  letter-spacing:2px;
  color:#00e676;
}

/* HERO SMALL */
.hero{
  text-align:center;
  padding:30px 20px;
}

.hero p{
  color:#aaa;
}

/* CONTAINER */
.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

/* CARD */
.card{
  width:240px;
  background:#161616;
  padding:20px;
  border-radius:14px;
  border:1px solid #222;
  transition:0.25s;
}

.card:hover{
  transform:translateY(-5px);
  background:#1f1f1f;
}

.note{
  font-size:12px;
  color:#888;
  margin-top:5px;
}

select{
  width:100%;
  padding:8px;
  margin-top:10px;
  border-radius:8px;
  background:#111;
  color:white;
  border:1px solid #333;
}

/* BUTTON FIX */
.btn{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#00c853,#00e676);
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

.btn:hover{
  transform:scale(1.03);
}

footer{
  text-align:center;
  padding:20px;
  color:#666;
  font-size:12px;
  border-top:1px solid #222;
  margin-top:30px;
}
</style>
</head>

<body>

<nav>
  <div class="logo">KEANN MARKET</div>
</nav>

<div class="hero">
  <h1>PRODUK</h1>
  <p>Pilih layanan yang kamu butuhkan</p>
</div>

<div class="container">

  <!-- BOT -->
  <div class="card">
    <h3>Bot WhatsApp</h3>

    <select id="botSelect">
      <option value="Bot WA 1 Hari - 2K">1 Hari - 2K</option>
      <option value="Bot WA 7 Hari - 5K">7 Hari - 5K</option>
      <option value="Bot WA 30 Hari - 8K">30 Hari - 8K</option>
      <option value="Bot WA Permanen - 15K">Permanen - 15K</option>
    </select>

    <button class="btn" onclick="orderBot()">ORDER</button>
  </div>

  <!-- DRIP -->
  <div class="card">
    <h3>DRIP CLIENT KEY</h3>

    <select id="dripSelect">
      <option value="DRIP 1 Hari - 25K">1 Hari</option>
      <option value="DRIP 3 Hari - 40K">3 Hari</option>
      <option value="DRIP 7 Hari - 65K">7 Hari</option>
      <option value="DRIP 30 Hari - 140K">30 Hari</option>
    </select>

    <button class="btn" onclick="orderDrip()">ORDER</button>
  </div>

  <!-- MOBI -->
  <div class="card">
    <h3>KEBUTUHAN MOBI</h3>

    <select id="mobiSelect">
      <option value="MOBI PERMANEN - 10K">APK MOBI</option>
      <option value="SET MOBI FF - 15K">SET MOBI FF</option>
    </select>

    <button class="btn" onclick="orderMobi()">ORDER</button>
  </div>

  <!-- OTHER -->
  <div class="card">
    <h3>QRIS NO KTP</h3>
    <button class="btn" onclick="order('QRIS NO KTP - 5K')">ORDER</button>
  </div>

  <div class="card">
    <h3>Nokos WA</h3>
    <button class="btn" onclick="order('Nokos WhatsApp')">ORDER</button>
  </div>

  <div class="card">
    <h3>Web Suntik</h3>
    <button class="btn" onclick="order('Web Suntik')">ORDER</button>
  </div>

  <div class="card">
    <h3>Jasapost</h3>
    <button class="btn" onclick="order('Jasapost FREE')">ORDER</button>
  </div>

  <div class="card">
    <h3>Web Nokos</h3>
    <button class="btn" onclick="order('Web Nokos')">ORDER</button>
  </div>

</div>

<footer>
  © KEANN MARKET
</footer>

<script>
let nomor = "628125895306";

function order(product){
  let pesan = `woi keann\n\ngua mau order ${product}`;
  window.open("https://wa.me/" + nomor + "?text=" + encodeURIComponent(pesan));
}

function orderBot(){
  order(document.getElementById("botSelect").value);
}

function orderDrip(){
  order(document.getElementById("dripSelect").value);
}

function orderMobi(){
  order(document.getElementById("mobiSelect").value);
}
</script>

</body>
</html>
