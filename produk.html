<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk - KEANN MARKET</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#0a0a0a;
  color:white;
  overflow-x:hidden;
}

/* HEADER */
nav{
  padding:18px 25px;
  background:#111;
  border-bottom:1px solid #222;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-weight:bold;
  letter-spacing:2px;
  color:#00e676;
}

/* HERO */
.hero{
  text-align:center;
  padding:40px 20px 20px;
  animation:fade 1s ease;
}

.hero h1{
  color:#00e676;
  font-size:40px;
  margin-bottom:10px;
}

.hero p{
  color:#aaa;
}

/* FADE */
@keyframes fade{
  from{opacity:0; transform:translateY(15px);}
  to{opacity:1; transform:translateY(0);}
}

/* CONTAINER */
.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:18px;
  padding:30px 20px;
}

/* CARD */
.card{
  width:250px;
  background:#161616;
  border:1px solid #222;
  border-radius:16px;
  padding:20px;
  transition:0.3s;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  background:radial-gradient(circle at top,#00e67610,#0000);
  opacity:0;
  transition:0.3s;
}

.card:hover::before{
  opacity:1;
}

.card:hover{
  transform:translateY(-6px);
  border-color:#00e67640;
}

.card h3{
  color:#00e676;
  margin-bottom:10px;
}

/* SELECT */
select{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  background:#111;
  color:white;
  border:1px solid #333;
  outline:none;
}

/* BUTTON */
.btn{
  width:100%;
  padding:10px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#00c853,#00e676);
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.25s;
  box-shadow:0 0 15px #00e67620;
}

.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px #00e67640;
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  color:#666;
  font-size:12px;
  border-top:1px solid #222;
  margin-top:30px;
}

</style>
</head>

<body>

<nav>
  <div class="logo">KEANN MARKET</div>
</nav>

<div class="hero">
  <h1>PRODUK</h1>
  <p>Pilih layanan digital yang kamu butuhkan</p>
</div>

<div class="container">

  <!-- BOT -->
  <div class="card">
    <h3>BOT WHATSAPP</h3>
    <select id="botSelect">
      <option value="Bot WA 1 Hari - 2K">1 Hari - 2K</option>
      <option value="Bot WA 7 Hari - 5K">7 Hari - 5K</option>
      <option value="Bot WA 30 Hari - 8K">30 Hari - 8K</option>
      <option value="Bot WA Permanen - 15K">Permanen - 15K</option>
    </select>
    <button class="btn" onclick="orderBot()">ORDER</button>
  </div>

  <!-- BUG -->
  <div class="card">
    <h3>BUG WHATSAPP</h3>
    <select id="bugSelect">
      <option value="JASA BUG - 5K">JASA BUG - 5K</option>
      <option value="MURBUG - 10K">MURBUG - 10K</option>
      <option value="ADMIN BUG - 25K">ADMIN BUG - 25K</option>
      <option value="OWN BUG - 40K">OWN BUG - 40K</option>
      <option value="SEWA BOT 1 BULAN - 55K">SEWA BOT 1 BULAN - 55K</option>
    </select>
    <button class="btn" onclick="orderBug()">ORDER</button>
  </div>

  <!-- DRIP -->
  <div class="card">
    <h3>DRIP CLIENT</h3>
    <select id="dripSelect">
      <option value="DRIP 1 Hari - 20K">1 Hari - 20K</option>
      <option value="DRIP 3 Hari - 40K">3 Hari - 40K</option>
      <option value="DRIP 7 Hari - 65K">7 Hari - 65K</option>
      <option value="DRIP 30 Hari - 140K">30 Hari - 140K</option>
    </select>
    <button class="btn" onclick="orderDrip()">ORDER</button>
  </div>

  <!-- MOBI -->
  <div class="card">
    <h3>MOBI</h3>
    <select id="mobiSelect">
      <option value="APK MOBI - 10K">APK MOBI - 10K</option>
      <option value="SET MOBI FF - 15K">SET MOBI - 15K</option>
    </select>
    <button class="btn" onclick="orderMobi()">ORDER</button>
  </div>

  <!-- SIMPLE ITEM -->
  <div class="card">
    <h3>QRIS NO KTP</h3>
    <button class="btn" onclick="order('QRIS NO KTP - 5K')">ORDER</button>
  </div>

  <div class="card">
    <h3>NOKOS WA</h3>
    <button class="btn" onclick="order('Nokos WhatsApp')">ORDER</button>
  </div>

  <div class="card">
    <h3>WEB SUNTIK</h3>
    <button class="btn" onclick="order('Web Suntik')">ORDER</button>
  </div>

  <div class="card">
    <h3>WEB NOKOS</h3>
    <button class="btn" onclick="order('Web Nokos')">ORDER</button>
  </div>

</div>

<footer>© KEANN MARKET</footer>

<script>
let nomor = "628125895306";

function order(product){
  let pesan = `KEANN MARKET ORDER\nProduk: ${product}`;
  window.open("https://wa.me/" + nomor + "?text=" + encodeURIComponent(pesan));
}

function orderBot(){
  order(document.getElementById("botSelect").value);
}

function orderBug(){
  order(document.getElementById("bugSelect").value);
}

function orderDrip(){
  order(document.getElementById("dripSelect").value);
}

function orderMobi(){
  order(document.getElementById("mobiSelect").value);
}
</script>

</body>
</html>
