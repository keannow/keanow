<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk - KEANN MARKET</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#0a0a0a;
  color:white;
}

nav{
  padding:18px;
  background:#111;
  border-bottom:1px solid #222;
}

.logo{
  color:#00e676;
  font-weight:bold;
  letter-spacing:2px;
}

.hero{
  text-align:center;
  padding:25px;
}

.hero h1{
  color:#00e676;
}

.hero p{
  color:#aaa;
}

.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

.card{
  width:240px;
  background:#161616;
  border:1px solid #222;
  padding:20px;
  border-radius:14px;
}

.card h3{
  color:#00e676;
}

select{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
  background:#111;
  color:white;
  border:1px solid #333;
}

.btn{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#00c853,#00e676);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

</style>
</head>

<body>

<nav>
  <div class="logo">KEANN MARKET</div>
</nav>

<div class="hero">
  <h1>PRODUK</h1>
  <p>Pilih dan lanjut ke checkout</p>
</div>

<div class="container">

  <div class="card">
    <h3>BOT WA</h3>
    <select id="botSelect">
      <option>Bot 1 Hari - 2K</option>
      <option>Bot 7 Hari - 5K</option>
      <option>Bot 30 Hari - 8K</option>
      <option>Bot Permanent - 15K</option>
    </select>
    <button class="btn" onclick="buy(document.getElementById('botSelect').value)">ORDER</button>
  </div>

  <div class="card">
    <h3>BUG WA</h3>
    <select id="bugSelect">
      <option>Jasa Bug - 5K</option>
      <option>MurBug - 10K</option>
      <option>Admin Bug - 25K</option>
      <option>Own Bug - 40K</option>
    </select>
    <button class="btn" onclick="buy(document.getElementById('bugSelect').value)">ORDER</button>
  </div>

  <div class="card">
    <h3>DRIP</h3>
    <select id="dripSelect">
      <option>1 Hari - 20K</option>
      <option>3 Hari - 40K</option>
      <option>7 Hari - 65K</option>
      <option>30 Hari - 140K</option>
    </select>
    <button class="btn" onclick="buy(document.getElementById('dripSelect').value)">ORDER</button>
  </div>

  <div class="card">
    <h3>MOBI</h3>
    <select id="mobiSelect">
      <option>APK MOBI - 10K</option>
      <option>SET MOBI - 15K</option>
    </select>
    <button class="btn" onclick="buy(document.getElementById('mobiSelect').value)">ORDER</button>
  </div>

</div>

<script>

function buy(product){
  localStorage.setItem("keann_product", product);
  window.location.href = "checkout.html";
}

</script>

</body>
</html>
