<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk - KEANN MARKET</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#eef4ff;
  color:#0f172a;
}

/* NAV */
nav{
  padding:18px 25px;
  background:white;
  border-bottom:1px solid #e5e7eb;
}

.logo{
  font-weight:bold;
  color:#5b8cff;
  letter-spacing:1px;
}

/* HERO */
.hero{
  text-align:center;
  padding:25px 20px;
}

.hero p{
  color:#64748b;
}

/* CONTAINER */
.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

/* CARD */
.card{
  width:240px;
  background:white;
  padding:18px;
  border-radius:16px;
  border:1px solid #e5e7eb;
  box-shadow:0 10px 20px rgba(0,0,0,0.05);
  transition:0.2s;
}

.card:hover{
  transform:translateY(-4px);
}

select{
  width:100%;
  padding:8px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #dbe3f0;
  background:#f8fbff;
}

/* BUTTON */
.btn{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#5b8cff;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
  box-shadow:0 8px 15px rgba(91,140,255,0.25);
}

.btn:hover{
  transform:translateY(-2px);
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  color:#94a3b8;
  font-size:12px;
  margin-top:30px;
}
</style>
</head>

<body>

<nav>
  <div class="logo">KEANN MARKET</div>
</nav>

<div class="hero">
  <h2>PRODUK</h2>
</div>

<div class="container">

  <div class="card">
    <h3>Bot WhatsApp</h3>
    <select id="botSelect">
      <option value="Bot 1 Hari - 2K">1 Hari</option>
      <option value="Bot 7 Hari - 5K">7 Hari</option>
      <option value="Bot 30 Hari - 8K">30 Hari</option>
      <option value="Bot Permanen - 15K">Permanen</option>
    </select>
    <button class="btn" onclick="orderBot()">ORDER</button>
  </div>

  <div class="card">
    <h3>DRIP KEY</h3>
    <select id="dripSelect">
      <option value="DRIP 1 Hari - 25K">1 Hari</option>
      <option value="DRIP 7 Hari - 65K">7 Hari</option>
      <option value="DRIP 30 Hari - 140K">30 Hari</option>
    </select>
    <button class="btn" onclick="orderDrip()">ORDER</button>
  </div>

  <div class="card">
    <h3>APK MOBI</h3>
    <select id="mobiSelect">
      <option value="APK MOBI - 10K">APK MOBI</option>
      <option value="SET FF - 15K">SET FF</option>
    </select>
    <button class="btn" onclick="orderMobi()">ORDER</button>
  </div>

  <div class="card">
    <h3>QRIS NO KTP</h3>
    <button class="btn" onclick="order('QRIS NO KTP - 5K')">ORDER</button>
  </div>

  <div class="card">
    <h3>Nokos WA</h3>
    <button class="btn" onclick="order('Nokos WA')">ORDER</button>
  </div>

  <div class="card">
    <h3>Web Suntik</h3>
    <button class="btn" onclick="order('Web Suntik')">ORDER</button>
  </div>

  <div class="card">
    <h3>Jasapost</h3>
    <button class="btn" onclick="order('Jasapost')">ORDER</button>
  </div>

  <div class="card">
    <h3>Web Nokos</h3>
    <button class="btn" onclick="order('Web Nokos')">ORDER</button>
  </div>

</div>

<footer>KEANN MARKET</footer>

<script>
let nomor="628125895306";

function order(p){
  window.open("https://wa.me/"+nomor+"?text="+encodeURIComponent("woi keann\n\ngua mau order "+p));
}

function orderBot(){
  order(document.getElementById("botSelect").value);
}

function orderDrip(){
  order(document.getElementById("dripSelect").value);
}

function orderMobi(){
  order(document.getElementById("mobiSelect").value);
}
</script>

</body>
</html>
